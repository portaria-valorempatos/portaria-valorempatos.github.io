<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorem - Agendamento Portaria (Teste)</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="valorem-simbolo-verde-transparente.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        valorem: {
                            DEFAULT: '#00732E',
                            light: '#00943c',
                            dark: '#005421',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics-compat.js"></script>
</head>
<!-- O clique em qualquer lugar da tela libera o áudio no navegador -->
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between" onclick="permitirAudio()">

    <!-- Áudio do Caminhão (Fica oculto) -->
    <audio id="som-caminhao" src="https://actions.google.com/sounds/v1/transportation/truck_horn.ogg" preload="auto"></audio>

    <!-- Topo / Header -->
    <header class="bg-white shadow-sm border-b border-slate-200 py-3 px-4 sm:px-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <img src="valorem-logotipo-horizontal-verde-com-slogan-transparente.png" alt="Valorem Logotipo" class="h-8 sm:h-10 object-contain">
            <span class="bg-red-100 text-red-700 font-bold px-2 py-1 rounded text-xs">AMBIENTE DE TESTE</span>
        </div>
        <div class="flex items-center space-x-2 sm:space-x-3">
            <span id="status-conexao" class="text-[10px] sm:text-xs px-2.5 py-1 rounded-full font-medium bg-green-100 text-green-800">Online (Sincronizado)</span>
            <button onclick="solicitarSenhaAdmin()" id="btn-admin-status" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-slate-300">
                🔒 Modo Admin
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl w-full mx-auto p-2 sm:p-4 lg:p-6 flex-grow">
        
        <!-- Alerta para desbloquear áudio -->
        <div id="aviso-audio" class="max-w-3xl mx-auto mb-4 bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded-xl text-sm text-center font-medium cursor-pointer" onclick="esconderAvisoAudio()">
            🔊 Clique em qualquer lugar desta tela para ativar os alertas sonoros. (Obrigatório no primeiro acesso)
        </div>

        <!-- Abas de Navegação -->
        <div class="flex justify-center mb-5">
            <div class="bg-slate-200 p-1 rounded-xl flex space-x-1 shadow-inner">
                <button id="tab-registrar" onclick="switchTab('registrar')" class="px-5 py-2 rounded-lg font-semibold text-xs sm:text-sm transition-all duration-200 bg-white text-valorem shadow-sm">
                    Registrar / Gerenciar
                </button>
                <button id="tab-consultas" onclick="switchTab('consultas')" class="px-5 py-2 rounded-lg font-semibold text-xs sm:text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">
                    Consultas (Público)
                </button>
            </div>
        </div>

        <!-- Seção 1: Formulário de Registro / Edição -->
        <section id="section-registrar" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 max-w-3xl mx-auto">
            <div class="bg-valorem p-5 text-white flex justify-between items-center">
                <div>
                    <h2 id="form-titulo" class="text-lg sm:text-xl font-bold tracking-wide">Novo Agendamento</h2>
                    <p id="form-subtitulo" class="text-xs text-green-100 mt-0.5">Preencha os dados de entrada na portaria.</p>
                </div>
                <button id="btn-cancelar-edicao" onclick="cancelarEdicao()" class="hidden bg-amber-500 hover:bg-amber-600 text-white text-xs px-3 py-1.5 rounded-lg font-semibold transition">
                    Cancelar Edição
                </button>
            </div>

            <form id="form-agendamento" onsubmit="salvarAgendamento(event)" class="p-4 sm:p-6 space-y-4">
                <input type="hidden" id="edit-id" value="">
                <input type="hidden" id="edit-data-registro" value="">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Operação -->
                    <div>
                        <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1">Operação *</label>
                        <select id="operacao" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none bg-white text-slate-700 text-sm transition">
                            <option value="" disabled selected>Selecione a operação</option>
                            <option value="Carregamento">Carregamento</option>
                            <option value="Descarga">Descarga</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <!-- Data da Operação -->
                    <div>
                        <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1">Data da Operação *</label>
                        <input type="date" id="data-operacao" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none bg-white text-slate-700 text-sm transition">
                    </div>
                </div>

                <!-- Nome do Motorista -->
                <div>
                    <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1">Nome do Motorista *</label>
                    <input type="text" id="motorista" list="lista-motoristas" required placeholder="Digite ou selecione o nome" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none text-slate-700 text-sm transition">
                    <datalist id="lista-motoristas">
                        <option value="ANGELO CESAR DE MAGALHÃES">
                        <option value="BRUNO HENRIQUE ALVES DE JESUS">
                        <option value="CLAUDIO APARECIDO DE ARAUJO">
                        <option value="DANIEL HENRIQUE DE SOUSA">
                    </datalist>
                </div>

                <!-- Transportadora -->
                <div>
                    <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1">Transportadora *</label>
                    <input type="text" id="transportadora" list="lista-transportadoras" required placeholder="Digite ou selecione a transportadora" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none text-slate-700 text-sm transition">
                    <datalist id="lista-transportadoras">
                        <option value="G10 TRANSPORTES S.A">
                    </datalist>
                </div>

                <!-- Placas e Telefone -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1">Placa Cavalo *</label>
                        <input type="text" id="placa-cavalo" required placeholder="EX: ABC-1234" maxlength="8" oninput="formatarPlaca(this)" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none uppercase font-mono text-slate-700 text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1">Placa Carreta</label>
                        <input type="text" id="placa-carreta" placeholder="EX: DEF-5678" maxlength="8" oninput="formatarPlaca(this)" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none uppercase font-mono text-slate-700 text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1">Telefone</label>
                        <input type="text" id="telefone" placeholder="(34) 99999-9999" maxlength="15" oninput="formatarTelefone(this)" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none font-mono text-slate-700 text-sm transition">
                    </div>
                </div>

                <!-- Botão Salvar -->
                <div class="pt-2">
                    <button type="submit" id="btn-submit" class="w-full bg-valorem hover:bg-valorem-dark text-white font-semibold py-2.5 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2 text-sm">
                        <span>Registrar Entrada (TESTE)</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- Seção 2: Tabela de Consultas -->
        <section id="section-consultas" class="hidden space-y-3">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 px-1">
                <h3 class="text-base sm:text-lg font-bold text-slate-700">Painel de Agendamentos Ativos (TESTE)</h3>
                <button onclick="alternarDiasAnteriores()" id="btn-dias-anteriores" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3.5 py-1.5 rounded-xl text-xs font-semibold shadow-sm transition flex items-center space-x-1.5">
                    <span>🕒 Mostrar concluídos / anteriores</span>
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs sm:text-sm">
                        <thead>
                            <tr class="bg
