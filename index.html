<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorem - Agendamento Portaria</title>
    
    <!-- Favicon adicionado conforme solicitado -->
    <link rel="icon" type="image/png" href="valorem-simbolo-verde-transparente.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        valorem: {
                            DEFAULT: '#00732E', // Cor principal definida
                            light: '#00943c',
                            dark: '#005421'
                        }
                    },
                    fontFamily: {
                        sans: ['"Humanst521 BT"', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
        }
        .hidden-view {
            display: none;
        }
        .tab-content {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background-color: #00732E;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: opacity 0.5s ease-in-out;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Cabeçalho com Logo -->
    <header class="bg-white shadow-sm border-b-4 border-valorem">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-center sm:justify-start items-center">
            <img src="valorem-logotipo-horizontal-verde-com-slogan-transparente.png" alt="Valorem" class="h-12 mx-auto sm:mx-0 object-contain">
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        
        <!-- Navegação de Abas -->
        <div class="flex justify-center mb-8">
            <div class="inline-flex bg-gray-200 rounded-lg p-1 shadow-inner">
                <button id="tab-btn-registrar" class="tab-btn px-6 py-2.5 rounded-md text-sm font-medium transition-colors focus:outline-none bg-white text-valorem shadow" onclick="switchTab('registrar')">
                    Registrar (Portaria)
                </button>
                <button id="tab-btn-consultas" class="tab-btn px-6 py-2.5 rounded-md text-sm font-medium transition-colors focus:outline-none text-gray-600 hover:text-valorem" onclick="switchTab('consultas')">
                    Consultas (Público)
                </button>
            </div>
        </div>

        <!-- Seção: Registrar (Portaria) -->
        <section id="view-registrar" class="tab-content max-w-xl mx-auto">
            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <div class="px-6 py-4 bg-valorem text-white border-b border-gray-200">
                    <h2 class="text-lg font-semibold">Novo Agendamento</h2>
                    <p class="text-sm opacity-90">Preencha os dados de entrada na portaria.</p>
                </div>
                
                <form id="agendamento-form" class="p-6 space-y-5">
                    <!-- Operação e Data da Operação -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="operacao" class="block text-sm font-medium text-gray-700 mb-1">Operação *</label>
                            <select id="operacao" name="operacao" required class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-valorem focus:border-valorem sm:text-sm">
                                <option value="" disabled selected>Selecione a operação</option>
                                <option value="Carregamento">Carregamento</option>
                                <option value="Descarga">Descarga</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                        <div>
                            <label for="data_operacao" class="block text-sm font-medium text-gray-700 mb-1">Data da Operação *</label>
                            <input type="date" id="data_operacao" name="data_operacao" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-valorem focus:border-valorem sm:text-sm">
                        </div>
                    </div>

                    <!-- Nome do Motorista e Transportadora -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="motorista" class="block text-sm font-medium text-gray-700 mb-1">Nome do Motorista *</label>
                            <input type="text" id="motorista" name="motorista" list="motoristas-list" required placeholder="Digite ou selecione o nome" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-valorem focus:border-valorem sm:text-sm">
                            <datalist id="motoristas-list">
                                <option value="ANGELO CESAR DE MAGALHÃES"></option>
                                <option value="CLAUDIO APARECIDO DE ARAUJO"></option>
                                <option value="DANIEL HENRIQUE DE SOUSA"></option>
                                <option value="DENILSON LAZARO CORREA"></option>
                                <option value="ECIO CRISTINO FERREIRA"></option>
                                <option value="ERNANI EUSTAQUIO DE SOUSA"></option>
                                <option value="FERNANDO DIVINO SILVESTRE"></option>
                                <option value="JOAO BRAZ DE OLIVEIRA"></option>
                                <option value="JOSE DOS REIS TEODORO"></option>
                                <option value="JOSE VALDECIR CORREA"></option>
                                <option value="JULIO CESAR DE OLIVEIRA"></option>
                                <option value="KLEBER ADILSON LIUTI"></option>
                                <option value="LINDOMAR MOREIRA DE LIMA"></option>
                                <option value="MARCILIO NUNES GOMES"></option>
                                <option value="MARCIO A. BATISTA PEREIRA"></option>
                                <option value="MARCO TULIO DE MELO"></option>
                                <option value="MAURINO DA SILVA CUSTODIO"></option>
                                <option value="MAURO FRANCISCO PEREIRA"></option>
                                <option value="MAX RICARDO PANTALEAO"></option>
                                <option value="NATANIEL CICERO DA SILVA"></option>
                                <option value="OSVANDO RODRIGUES ALVES"></option>
                                <option value="RENIO JOSE PEREIRA"></option>
                                <option value="RENIVALDO RENATO DE QUEIROZ"></option>
                                <option value="RICARDO JOSE DE SOUSA"></option>
                                <option value="RODRIGO DOS REIS VIEIRA"></option>
                                <option value="ROSEY MARQUES DE FREITAS"></option>
                                <option value="WELTON DA SILVA LEMOS"></option>
                            </datalist>
                        </div>
                        <div>
                            <label for="transportadora" class="block text-sm font-medium text-gray-700 mb-1">Transportadora *</label>
                            <input type="text" id="transportadora" name="transportadora" required placeholder="Ex: G10 TRANSPORTES" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-valorem focus:border-valorem sm:text-sm">
                        </div>
                    </div>

                    <!-- Placas e Telefone -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                        <div>
                            <label for="placa_cavalo" class="block text-sm font-medium text-gray-700 mb-1">Placa Cavalo *</label>
                            <!-- Máximo de 8 caracteres contando o hífen (Ex: ABC-1234) -->
                            <input type="text" id="placa_cavalo" name="placa_cavalo" required placeholder="Ex: ABC-1234" maxlength="8" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-valorem focus:border-valorem sm:text-sm uppercase font-mono">
                        </div>
                        <div>
                            <label for="placa_carreta" class="block text-sm font-medium text-gray-700 mb-1">Placa Carreta</label>
                            <input type="text" id="placa_carreta" name="placa_carreta" placeholder="Ex: ABC-1234" maxlength="8" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-valorem focus:border-valorem sm:text-sm uppercase font-mono">
                        </div>
                        <div>
                            <label for="telefone" class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" maxlength="15" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-valorem focus:border-valorem sm:text-sm">
                        </div>
                    </div>

                    <!-- Status de Autenticação/Carregamento -->
                    <div id="auth-status" class="text-sm text-gray-500 italic hidden">Conectando ao sistema...</div>

                    <!-- Botão de Envio -->
                    <div class="pt-2">
                        <button type="submit" id="btn-submit" disabled class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-valorem hover:bg-valorem-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-valorem disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            Registrar Entrada
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Seção: Consultas (Público) -->
        <section id="view-consultas" class="tab-content hidden-view">
            
            <!-- Botão para alternar visualização de dias anteriores -->
            <div class="mb-4 flex justify-end">
                <button id="btn-toggle-past" class="px-4 py-2 rounded-md text-sm font-medium transition-colors focus:outline-none bg-gray-200 text-gray-700 hover:bg-gray-300 flex items-center shadow-sm">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Mostrar dias anteriores
                </button>
            </div>

            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h2 class="text-lg font-semibold text-gray-800">Registros Recentes</h2>
                    <div class="text-sm text-gray-500 flex items-center">
                        <span class="relative flex h-3 w-3 mr-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-3 w-3 bg-valorem"></span>
                        </span>
                        Sincronizado ao vivo
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-100">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data Registro</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data Operação</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Operação</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Motorista</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Transportadora</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Placa Cavalo</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Placa Carreta</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Telefone</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo" class="bg-white divide-y divide-gray-200">
                            <!-- Linhas inseridas via JS -->
                            <tr>
                                <td colspan="8" class="px-6 py-10 text-center text-gray-500">
                                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-valorem inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    Carregando dados...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div id="empty-state" class="hidden px-6 py-10 text-center text-gray-500">
                    Nenhum registro encontrado para exibição.
                </div>
            </div>
        </section>

    </main>

    <!-- Container para Toasts -->
    <div id="toast-container"></div>

    <!-- 
    ========================================================================
    LÓGICA DA APLICAÇÃO E INTEGRAÇÃO FIREBASE 
    ========================================================================
    Aviso para implementação no seu ambiente pessoal: 
    Este código utiliza a estrutura padrão de persistência. Se estiver 
    configurando seu próprio Firebase fora deste ambiente, certifique-se
    de inicializá-lo corretamente com suas credenciais de acesso ao Firestore.
    -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Variáveis de ambiente fornecidas pela plataforma
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'valorem-portaria-demo';
        const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        let firebaseConfig = {};
        
        if (firebaseConfigStr) {
            try { firebaseConfig = JSON.parse(firebaseConfigStr); } 
            catch (e) { console.error("Erro ao parsear firebase config", e); }
        } else {
             console.warn("Configuração do Firebase não encontrada. Dados serão apenas locais.");
        }

        let app, db, auth;
        let currentUser = null;
        let isFirebaseInitialized = false;

        // Estado local para armazenar dados e controlar exibição de dias anteriores
        let todosRegistros = [];
        let mostrarDiasAnteriores = false;

        try {
            if(Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                isFirebaseInitialized = true;
            }
        } catch (error) {
            console.error("Erro ao inicializar Firebase:", error);
        }

        const form = document.getElementById('agendamento-form');
        const btnSubmit = document.getElementById('btn-submit');
        const authStatus = document.getElementById('auth-status');
        const tabelaCorpo = document.getElementById('tabela-corpo');
        const emptyState = document.getElementById('empty-state');
        const btnTogglePast = document.getElementById('btn-toggle-past');

        // Alternância entre abas
        window.switchTab = function(tabName) {
            const viewRegistrar = document.getElementById('view-registrar');
            const viewConsultas = document.getElementById('view-consultas');
            const btnRegistrar = document.getElementById('tab-btn-registrar');
            const btnConsultas = document.getElementById('tab-btn-consultas');

            if (tabName === 'registrar') {
                viewRegistrar.classList.remove('hidden-view');
                viewConsultas.classList.add('hidden-view');
                btnRegistrar.className = 'tab-btn px-6 py-2.5 rounded-md text-sm font-medium transition-colors focus:outline-none bg-white text-valorem shadow';
                btnConsultas.className = 'tab-btn px-6 py-2.5 rounded-md text-sm font-medium transition-colors focus:outline-none text-gray-600 hover:text-valorem';
            } else {
                viewRegistrar.classList.add('hidden-view');
                viewConsultas.classList.remove('hidden-view');
                btnConsultas.className = 'tab-btn px-6 py-2.5 rounded-md text-sm font-medium transition-colors focus:outline-none bg-white text-valorem shadow';
                btnRegistrar.className = 'tab-btn px-6 py-2.5 rounded-md text-sm font-medium transition-colors focus:outline-none text-gray-600 hover:text-valorem';
            }
        };

        // Lógica do botão de alternância de dias anteriores
        btnTogglePast.addEventListener('click', () => {
            mostrarDiasAnteriores = !mostrarDiasAnteriores;
            
            // Alterar estilo do botão para mostrar se está ativo ou não
            if (mostrarDiasAnteriores) {
                btnTogglePast.innerHTML = '<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg> Ocultar dias anteriores';
                btnTogglePast.classList.replace('bg-gray-200', 'bg-valorem');
                btnTogglePast.classList.replace('text-gray-700', 'text-white');
                btnTogglePast.classList.replace('hover:bg-gray-300', 'hover:bg-valorem-dark');
            } else {
                btnTogglePast.innerHTML = '<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Mostrar dias anteriores';
                btnTogglePast.classList.replace('bg-valorem', 'bg-gray-200');
                btnTogglePast.classList.replace('text-white', 'text-gray-700');
                btnTogglePast.classList.replace('hover:bg-valorem-dark', 'hover:bg-gray-300');
            }

            // Re-renderizar tabela com a nova configuração de filtro
            renderTable(todosRegistros);
        });

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const icon = type === 'success' 
                ? `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`
                : `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                
            toast.className = `toast ${type === 'error' ? 'bg-red-500' : 'bg-valorem'}`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => { toast.style.opacity = '1'; });
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        async function setupApp() {
            if (!isFirebaseInitialized) {
                btnSubmit.disabled = false;
                setupOfflineMode();
                return;
            }
            authStatus.classList.remove('hidden');
            authStatus.textContent = "Conectando ao banco de dados...";

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUser = auth.currentUser;
                authStatus.classList.add('hidden');
                btnSubmit.disabled = false;
                setupRealtimeListener();
            } catch (error) {
                console.error("Erro na autenticação:", error);
                authStatus.textContent = "Erro de conexão. Tente recarregar a página.";
                authStatus.classList.add('text-red-500');
            }
        }

        function setupRealtimeListener() {
            if (!currentUser || !isFirebaseInitialized) return;

            const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'agendamentos');
            
            // onSnapshot garante que os dados atualizam em tempo real e mantem na tela ao recarregar a página
            onSnapshot(collectionRef, 
                (snapshot) => {
                    todosRegistros = [];
                    snapshot.forEach((doc) => {
                        todosRegistros.push({ id: doc.id, ...doc.data() });
                    });
                    
                    // Ordenar por ordem de agendamento (mais recentes primeiro)
                    todosRegistros.sort((a, b) => b.timestamp - a.timestamp);
                    
                    renderTable(todosRegistros);
                },
                (error) => {
                    console.error("Erro ao escutar dados:", error);
                    tabelaCorpo.innerHTML = `<tr><td colspan="8" class="px-6 py-4 text-center text-red-500">Erro ao carregar dados.</td></tr>`;
                }
            );
        }

        function formatarDataHora(timestamp) {
            if (!timestamp) return '-';
            const data = new Date(timestamp);
            return data.toLocaleString('pt-BR', { 
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute:'2-digit'
            });
        }

        function formatarDataSimples(dataStr) {
            if (!dataStr) return '-';
            const partes = dataStr.split('-');
            if (partes.length !== 3) return dataStr;
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        // Obtém a data local de hoje no formato YYYY-MM-DD
        function obterDataLocalHoje() {
            const data = new Date();
            const offset = data.getTimezoneOffset();
            const dataLocal = new Date(data.getTime() - (offset * 60 * 1000));
            return dataLocal.toISOString().split('T')[0];
        }

        function renderTable(dados) {
            tabelaCorpo.innerHTML = '';
            
            const hojeStr = obterDataLocalHoje();

            // Filtrar dados baseados no toggle
            const dadosFiltrados = dados.filter(item => {
                if (mostrarDiasAnteriores) return true; // Mostra todos se toggle ativado
                // Se toggle desativado, mostra apenas se data da operação for HOJE ou FUTURO
                return item.data_operacao >= hojeStr;
            });
            
            if (dadosFiltrados.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                dadosFiltrados.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    tr.className = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                    
                    let opColorClass = "bg-gray-100 text-gray-800";
                    if(item.operacao === 'Carregamento') opColorClass = "bg-blue-100 text-blue-800";
                    if(item.operacao === 'Descarga') opColorClass = "bg-valorem/20 text-valorem-dark";
                    
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatarDataHora(item.timestamp)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">${formatarDataSimples(item.data_operacao)}</td>
                        <td class="px-6 py-4 whitespace-nowrap"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${opColorClass}">${item.operacao}</span></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.motorista}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.transportadora || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 uppercase font-mono">${item.placa_cavalo}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 uppercase font-mono">${item.placa_carreta || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.telefone || '-'}</td>
                    `;
                    tabelaCorpo.appendChild(tr);
                });
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const operacao = document.getElementById('operacao').value;
            const data_operacao = document.getElementById('data_operacao').value;
            const motorista = document.getElementById('motorista').value;
            const transportadora = document.getElementById('transportadora').value;
            const placa_cavalo = document.getElementById('placa_cavalo').value.toUpperCase();
            const placa_carreta = document.getElementById('placa_carreta').value.toUpperCase();
            const telefone = document.getElementById('telefone').value;

            if (!operacao || !data_operacao || !motorista || !transportadora || !placa_cavalo) {
                showToast('Preencha os campos obrigatórios.', 'error');
                return;
            }

            const novoAgendamento = {
                operacao,
                data_operacao,
                motorista,
                transportadora,
                placa_cavalo,
                placa_carreta,
                telefone,
                timestamp: Date.now(), // Grava timestamp do exato momento
                criadoPor: currentUser ? currentUser.uid : 'anonimo'
            };

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Registrando...';

            try {
                if (isFirebaseInitialized && currentUser) {
                    const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'agendamentos');
                    await addDoc(collectionRef, novoAgendamento);
                } else {
                    salvarMockLocal(novoAgendamento);
                }
                
                form.reset();
                showToast('Entrada registrada com sucesso!');

            } catch (error) {
                console.error("Erro ao salvar:", error);
                showToast('Erro ao salvar registro.', 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Registrar Entrada';
            }
        });

        // Formatação Automática de Placas
        function aplicarMascaraPlaca(e) {
            let valor = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); // Somente alfanuméricos
            if (valor.length > 3) {
                // Inserir o hífen obrigatoriamente após a 3ª letra
                valor = valor.substring(0, 3) + '-' + valor.substring(3, 7);
            }
            e.target.value = valor;
        }

        document.getElementById('placa_cavalo').addEventListener('input', aplicarMascaraPlaca);
        document.getElementById('placa_carreta').addEventListener('input', aplicarMascaraPlaca);

        // Máscara de Telefone BR
        document.getElementById('telefone').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, "");
            v = v.replace(/^(\d{2})(\d)/g, "($1) $2"); 
            v = v.replace(/(\d)(\d{4})$/, "$1-$2");
            e.target.value = v.substring(0, 15);
        });

        function setupOfflineMode() {
            tabelaCorpo.innerHTML = `<tr><td colspan="8" class="px-6 py-10 text-center text-gray-500">Modo de demonstração local ativo.</td></tr>`;
            renderTable(todosRegistros);
        }

        function salvarMockLocal(dado) {
            todosRegistros.unshift(dado);
            renderTable(todosRegistros);
        }

        setupApp();
    </script>
</body>
</html>
