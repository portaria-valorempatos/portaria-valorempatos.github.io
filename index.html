<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorem - Agendamento Portaria</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="valorem-simbolo-verde-transparente.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        valorem: {
                            DEFAULT: '#00732E',
                            light: '#00943c',
                            dark: '#005421',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Topo / Header -->
    <header class="bg-white shadow-sm border-b border-slate-200 py-4 px-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <img src="valorem-logotipo-horizontal-verde-com-slogan-transparente.png" alt="Valorem Logotipo" class="h-10 object-contain">
        </div>
        <div class="flex items-center space-x-3">
            <span id="status-conexao" class="text-xs px-2.5 py-1 rounded-full font-medium bg-amber-100 text-amber-800">Conectando...</span>
            <button onclick="solicitarSenhaAdmin()" id="btn-admin-status" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-slate-300">
                🔒 Modo Admin
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-6xl w-full mx-auto p-4 sm:p-6 flex-grow">
        
        <!-- Abas de Navegação -->
        <div class="flex justify-center mb-6">
            <div class="bg-slate-200 p-1 rounded-xl flex space-x-1 shadow-inner">
                <button id="tab-registrar" onclick="switchTab('registrar')" class="px-6 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 bg-white text-valorem shadow-sm">
                    Registrar / Gerenciar
                </button>
                <button id="tab-consultas" onclick="switchTab('consultas')" class="px-6 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">
                    Consultas (Público)
                </button>
            </div>
        </div>

        <!-- Seção 1: Formulário de Registro / Edição -->
        <section id="section-registrar" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 max-w-3xl mx-auto">
            <div class="bg-valorem p-6 text-white flex justify-between items-center">
                <div>
                    <h2 id="form-titulo" class="text-xl font-bold tracking-wide">Novo Agendamento</h2>
                    <p id="form-subtitulo" class="text-xs text-green-100 mt-1">Preencha os dados de entrada na portaria.</p>
                </div>
                <button id="btn-cancelar-edicao" onclick="cancelarEdicao()" class="hidden bg-amber-500 hover:bg-amber-600 text-white text-xs px-3 py-1.5 rounded-lg font-semibold transition">
                    Cancelar Edição
                </button>
            </div>

            <form id="form-agendamento" onsubmit="salvarAgendamento(event)" class="p-6 sm:p-8 space-y-5">
                <input type="hidden" id="edit-id" value="">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <!-- Operação -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Operação *</label>
                        <select id="operacao" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none bg-white text-slate-700 transition">
                            <option value="" disabled selected>Selecione a operação</option>
                            <option value="Carregamento">Carregamento</option>
                            <option value="Descarga">Descarga</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <!-- Data da Operação -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Data da Operação *</label>
                        <input type="date" id="data-operacao" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none bg-white text-slate-700 transition">
                    </div>
                </div>

                <!-- Nome do Motorista -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nome do Motorista *</label>
                    <input type="text" id="motorista" list="lista-motoristas" required placeholder="Digite ou selecione o nome" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none text-slate-700 transition">
                    <datalist id="lista-motoristas">
                        <option value="ANGELO CESAR DE MAGALHÃES">
                        <option value="BRUNO HENRIQUE ALVES DE JESUS">
                        <option value="CLAUDIO APARECIDO DE ARAUJO">
                        <option value="DANIEL HENRIQUE DE SOUSA">
                        <option value="DENILSON LAZARO CORREA">
                        <option value="ECIO CRISTINO FERREIRA">
                        <option value="ERNANI EUSTAQUIO DE SOUSA">
                        <option value="FERNANDO DIVINO SILVESTRE">
                        <option value="JOAO BRAZ DE OLIVEIRA">
                        <option value="JOSE DOS REIS TEODORO">
                        <option value="JOSE VALDECIR CORREA">
                        <option value="JULIO CESAR DE OLIVEIRA">
                        <option value="KLEBER ADILSON LIUTI">
                        <option value="LINDOMAR MOREIRA DE LIMA">
                        <option value="MARCILIO NUNES GOMES">
                        <option value="MARCIO A. BATISTA PEREIRA">
                        <option value="MARCO TULIO DE MELO">
                        <option value="MAURINO DA SILVA CUSTODIO">
                        <option value="MAURO FRANCISCO PEREIRA">
                        <option value="MAX RICARDO PANTALEAO">
                        <option value="NATANIEL CICERO DA SILVA">
                        <option value="OSVANDO RODRIGUES ALVES">
                        <option value="RENIO JOSE PEREIRA">
                        <option value="RENIVALDO RENATO DE QUEIROZ">
                        <option value="RICARDO JOSE DE SOUSA">
                        <option value="RODRIGO DOS REIS VIEIRA">
                        <option value="ROSEY MARQUES DE FREITAS">
                        <option value="TIAGO AUGUSTO SILVA">
                        <option value="VANDERLEI MARTINS RIBEIRO">
                        <option value="VINICIUS JOSE DA SCUNHA SILVEIRA">
                        <option value="WANDERSON VINICIUS DE SOUSA MACHADO">
                        <option value="WELLINGTON WESLEY A. FERREIRA">
                        <option value="WELTON DA SILVA LEMOS">
                    </datalist>
                </div>

                <!-- Transportadora -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Transportadora *</label>
                    <input type="text" id="transportadora" list="lista-transportadoras" required placeholder="Digite ou selecione a transportadora" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none text-slate-700 transition">
                    <datalist id="lista-transportadoras">
                        <option value="G10 TRANSPORTES S.A">
                    </datalist>
                </div>

                <!-- Placas e Telefone -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Placa Cavalo *</label>
                        <input type="text" id="placa-cavalo" required placeholder="EX: ABC-1234" maxlength="8" oninput="formatarPlaca(this)" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none uppercase font-mono text-slate-700 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Placa Carreta</label>
                        <input type="text" id="placa-carreta" placeholder="EX: DEF-5678" maxlength="8" oninput="formatarPlaca(this)" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none uppercase font-mono text-slate-700 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Telefone</label>
                        <input type="text" id="telefone" placeholder="(34) 99999-9999" maxlength="15" oninput="formatarTelefone(this)" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-valorem focus:border-valorem outline-none font-mono text-slate-700 transition">
                    </div>
                </div>

                <!-- Botão Salvar -->
                <div class="pt-3">
                    <button type="submit" id="btn-submit" class="w-full bg-valorem hover:bg-valorem-dark text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2">
                        <span>Registrar Entrada</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- Seção 2: Tabela de Consultas -->
        <section id="section-consultas" class="hidden space-y-4">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <h3 class="text-lg font-bold text-slate-700">Painel de Agendamentos Ativos</h3>
                <button onclick="alternarDiasAnteriores()" id="btn-dias-anteriores" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold shadow-sm transition flex items-center space-x-1.5">
                    <span>🕒 Mostrar dias anteriores</span>
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                <th class="p-4">Registro (Data/Hora)</th>
                                <th class="p-4">Data Operação</th>
                                <th class="p-4">Operação</th>
                                <th class="p-4">Motorista</th>
                                <th class="p-4">Transportadora</th>
                                <th class="p-4">Placa Cavalo</th>
                                <th class="p-4">Placa Carreta</th>
                                <th class="p-4">Telefone</th>
                                <th id="th-acoes" class="p-4 text-center hidden">Ações (Admin)</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-registros" class="divide-y divide-slate-100 text-sm text-slate-700">
                            <tr><td colspan="9" class="text-center p-8 text-slate-400 font-medium">Carregando registros...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal de Senha Admin -->
    <div id="modal-admin" class="fixed inset-0 bg-slate-90
